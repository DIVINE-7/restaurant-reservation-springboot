spring.application.name=restaurant-reservation-springboot

server.port=8080

spring.datasource.url=jdbc:mysql://localhost:3306/restaurant_reservation_db
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:Ankit@6463}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false


# Configure a strong JWT secret using an environment variable.
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=86400000

# Angular development server
app.cors.allowed-origin=http://localhost:4200

logging.level.org.springframework.security=INFO